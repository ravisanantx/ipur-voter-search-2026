<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ipur Voter Search 2026</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#1b2c3d;font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif}header{background:#123b47;color:white;padding:9.9px 20px}header>div,main{max-width:1120px;margin:auto}header small{color:#b8d9db;letter-spacing:.12em;font-weight:600}h1{margin:5px 0;font-size:clamp(24px,4vw,36px);letter-spacing:-.03em}header p{margin:0;color:#d4e5e8}main{padding:0 16px 45px}.panel{background:white;border:1px solid #dce4ea;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 3px 12px #123b4708}h2{margin:0 0 4px;font-size:19px}.muted{color:#5b6b78;font-size:14px;margin:4px 0 18px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:end}label{display:block;font-size:13px;font-weight:650}input,select,button{font:inherit;border-radius:8px;min-height:45px}input,select{width:100%;border:1px solid #aabac6;background:white;padding:9px 11px;color:#182d3d;margin-top:5px}button{border:0;background:#17685e;color:white;font-weight:650;padding:9px 21px;cursor:pointer}button.secondary{background:white;border:1px solid #b6c6cf;color:#234957}button:disabled{opacity:.45;cursor:not-allowed}input:focus,select:focus,button:focus-visible{outline:3px solid #77c9b8;outline-offset:2px}.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px;text-align:left}thead{background:#e9f1f2;color:#234957}th,td{padding:12px 10px;border-bottom:1px solid #e1e7ec;vertical-align:top}th{white-space:nowrap;font-size:12px;letter-spacing:.02em}tbody tr:nth-child(even){background:#f8fafb}td:nth-child(1),td:nth-child(2),td:nth-child(7),td:nth-child(8){font-variant-numeric:tabular-nums;text-align:center}tbody tr:hover{background:#edf7f4}.empty{padding:36px 12px;text-align:center;color:#526672}.pager{display:flex;gap:8px;align-items:center;margin-top:18px;justify-content:flex-end}footer{font-size:12px;color:#657582;padding:0 5px}#error{color:#a32929;margin:10px 0 0} [hidden]{display:none!important}@media(min-width:701px) and (max-width:980px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.fields button{grid-column:1/-1}}@media(max-width:700px){.fields{grid-template-columns:minmax(0,1fr)}.fields button{width:100%}.panel{padding:15px}.pager{justify-content:center}header{padding:9px 16px}}
.campaign-banner{margin:0;background:#1557a0;color:#ffffff;border-bottom:1px solid #10447d;padding:0 16px 12px;text-align:center;font-size:clamp(18px,3vw,26px);font-weight:500;line-height:1.65;overflow-wrap:break-word;font-family:"Noto Sans Telugu","Nirmala UI",Gautami,system-ui,sans-serif}.campaign-banner .message{display:flex;align-items:center;justify-content:center;gap:clamp(7px,2vw,20px);max-width:1120px;margin:0 auto;text-align:center}.campaign-banner .basket{width:clamp(72px,14vw,140px);height:auto;flex:0 0 auto;border-radius:5px;display:block}.campaign-banner .message span{min-width:0;overflow-wrap:anywhere}.campaign-banner .election-time{margin:7px auto 0;font-size:clamp(13px,2.1vw,18px);font-weight:650;line-height:1.5;white-space:nowrap}.campaign-banner small{display:block;font-size:11px;letter-spacing:.05em;color:#ffffff;font-weight:600}
@media(max-width:600px){.campaign-banner .basket{width:clamp(55px,16vw,80px)}.campaign-banner .message{gap:6px}.campaign-banner .election-time{white-space:normal}}.header-block{width:100%}.subhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.subhead p{margin:0}.dateinfo{text-align:right}@media (max-width:720px){.subhead{display:block}.dateinfo{margin-top:6px;text-align:left}}
header h1{font-family:"Noto Sans Telugu","Nirmala UI",Gautami,system-ui,sans-serif;line-height:1.3;font-size:clamp(17px,2.4vw,24px);font-weight:700;letter-spacing:normal}.emphasis{font-size:1.17em;font-weight:900;-webkit-text-stroke:0.45px currentColor;text-shadow:0.2px 0 currentColor,-0.2px 0 currentColor}header h1 .emphasis{font-size:1.2em}
 .results-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.lang-toggle{display:inline-flex;align-items:center;gap:8px}.lang-toggle button{min-height:38px;border:1px solid #b6c6cf;border-radius:8px;padding:6px 13px;background:#fff;color:#234957;font-size:14px}.lang-toggle button.lang-active{background:#17685e;color:#fff}.lang-toggle button:focus-visible{outline-offset:-3px}body.telugu-results .tablewrap{font-family:"Noto Sans Telugu","Nirmala UI",Gautami,system-ui,sans-serif}@media(max-width:700px){.results-actions{width:100%;justify-content:space-between}.lang-toggle button{padding:6px 12px}}
main>section.panel:first-child{padding-top:12px;margin-top:0;margin-bottom:0}main>section.panel:nth-child(2){padding-top:10px}#status.muted{margin:2px 0 5px}thead th{padding:7px 10px;font-weight:800;line-height:1.25}
/* Compact search area: reduce vertical spacing by approximately 10%. */
main > section.panel:first-child { padding-top: 10.8px; padding-bottom: 19.8px; }
main > section.panel:first-child .fields { row-gap: 10.8px; }
main > section.panel:first-child .fields input { min-height: 40.5px; padding-top: 8.1px; padding-bottom: 8.1px; margin-top: 4.5px; }
main > section.panel:first-child .fields button { min-height: 40.5px; padding-top: 8.1px; padding-bottom: 8.1px; }
@media (max-width: 700px) { main > section.panel:first-child { padding-bottom: 13.5px; } }
</style></head><body><header><div class="header-block"><h1 lang="te"><strong class="emphasis">ఈపూరు</strong> గ్రామ పంచాయితీ ఓటరు Ward సెర్చ్</h1></div></header><aside class="campaign-banner" aria-label="Banner"><div class="message"><img class="basket" src="/basket.png" alt="Basket symbol" width="133" height="96"><span lang="te"><strong class="emphasis">బుట్ట (No: 4)</strong> గుర్తు పై ఓటు వేసి గెలిపించ ప్రార్థన</span><img class="basket" src="/basket.png" alt="" width="133" height="96"></div><p class="election-time" lang="te">తేదీ: 26-11-2026 (గురువారం)&nbsp;&nbsp;&nbsp; సమయం: ఉదయం 7:00 - 1:00</p></aside><main><section class="panel"><form id="form"><div class="fields"><label class="term" for="name">NAME పేరు<input id="name" name="name" type="search" maxlength="120" placeholder="Enter name" autocomplete="off"></label><label class="term" for="surname">SURNAME ఇంటి పేరు<input id="surname" name="surname" type="search" maxlength="120" placeholder="Enter surname" autocomplete="off"></label><label class="term" for="hno">H NO ఇంటి నంబర్<input id="hno" name="hno" type="search" maxlength="120" placeholder="Enter house number" autocomplete="off"></label><button type="submit" id="search">Search <strong lang="te">వెతుకు</strong></button></div><p id="error" role="alert" hidden></p></form></section><section class="panel"><div class="controls"><div class="results-actions"><div class="lang-toggle" role="group" aria-label="Result language"><button id="langEn" type="button" aria-pressed="true" class="lang-active">English</button><button id="langTe" type="button" aria-pressed="false" lang="te">తెలుగు</button></div><button id="clear" class="secondary" type="button">Clear search</button></div></div><p class="muted" id="status" role="status" aria-live="polite">Enter NAME, SURNAME or H NO to begin.</p><div class="tablewrap" tabindex="0" aria-label="Voter search results"><table><thead><tr><th data-col="0">Ward</th><th data-col="1">S NO</th><th data-col="2">NAME</th><th data-col="3">SURNAME</th><th data-col="4">F/H Name</th><th data-col="5">H NO</th><th data-col="6">AGE</th><th data-col="7">M/F</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">No search yet</td></tr></tbody></table></div><div class="pager" id="pager" hidden><button class="secondary" id="prev">Previous</button><span id="page"></span><button class="secondary" id="next">Next</button></div></section><footer>Note: This is not an official election authority website.</footer></main><script>
const $=id=>document.getElementById(id);
let active=null,current=1,seq=0,lang='en';
const strings={
 en:{headers:['Ward','S NO','NAME','SURNAME','F/H Name','H NO','AGE','M/F'],heading:'Search results',clear:'Clear search',prev:'Previous',next:'Next',intro:'Enter NAME, SURNAME or H NO to begin.',noSearch:'No search yet',searching:'Searching…',notFound:'No matching voters. Check the spelling or search another name.',none:'0 matching records',page:(p,n)=>`Page ${p} of ${n}`,count:(d)=>`${d.total.toLocaleString()} matching records · showing ${(d.page-1)*d.pageSize+1}–${Math.min(d.page*d.pageSize,d.total)}`,failed:'Search not completed.',retry:'Try another search.',error:'Enter NAME, SURNAME, or H NO.'},
 te:{headers:['వార్డు','సీరియల్ నం.','పేరు','ఇంటి పేరు','తండ్రి / భర్త పేరు','ఇంటి నం.','వయస్సు','లింగం'],heading:'ఓటరు శోధన ఫలితాలు',clear:'సెర్చ్ తొలగించు',prev:'మునుపటి',next:'తదుపరి',intro:'పేరు, ఇంటి పేరు లేదా ఇంటి నంబర్ నమోదు చేయండి.',noSearch:'ఇంకా వెతకలేదు',searching:'వెతుకుతోంది…',notFound:'ఓటర్లు కనబడలేదు. పేరు లేదా ఇంటి నంబర్‌ను పరిశీలించండి.',none:'సరిపోలిన ఓటర్లు: 0',page:(p,n)=>`పేజీ ${p} / ${n}`,count:(d)=>`సరిపోలిన ఓటర్లు: ${d.total.toLocaleString()} · చూపిస్తున్నవి ${(d.page-1)*d.pageSize+1}–${Math.min(d.page*d.pageSize,d.total)}`,failed:'శోధన పూర్తి కాలేదు.',retry:'మళ్ళీ ప్రయత్నించండి.',error:'పేరు, ఇంటి పేరు లేదా ఇంటి నంబర్ నమోదు చేయండి.'}
};
function words(){return strings[lang]}
function empty(message){$('rows').replaceChildren();const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=8;td.className='empty';td.textContent=message;tr.append(td);$('rows').append(tr);$('pager').hidden=true;}
function error(msg){$('error').textContent=msg;$('error').hidden=!msg;}
async function run(page){
 const ticket=++seq;error('');$('status').textContent=words().searching;
 $('search').disabled=true;$('prev').disabled=true;$('next').disabled=true;
 try{
  const params=new URLSearchParams({...active,page:String(page),lang});
  const resp=await fetch('/api/search?'+params);
  const data=await resp.json();if(ticket!==seq)return;
  if(!resp.ok)throw Error(data.error||words().failed);
  current=data.page;$('rows').replaceChildren();
  for(const row of data.rows){const tr=document.createElement('tr');for(const value of row){const td=document.createElement('td');td.textContent=value===null||value===''?'—':String(value);tr.append(td)}$('rows').append(tr)}
  $('status').textContent=data.total?words().count(data):words().none;
  if(!data.total)empty(words().notFound);
  $('pager').hidden=data.pages<=1;
  $('page').textContent=words().page(data.page,data.pages);
  $('prev').disabled=data.page<=1;$('next').disabled=data.page>=data.pages;
 }catch(e){if(ticket===seq){error(e.message);$('status').textContent=words().failed;empty(words().retry)}}
 finally{if(ticket===seq)$('search').disabled=false}
}
function setLanguage(next){
 if(!['en','te'].includes(next))return;
 lang=next;document.body.classList.toggle('telugu-results',lang==='te');
 $('langEn').setAttribute('aria-pressed',String(lang==='en'));$('langTe').setAttribute('aria-pressed',String(lang==='te'));
 $('langEn').classList.toggle('lang-active',lang==='en');$('langTe').classList.toggle('lang-active',lang==='te');
 $('clear').textContent=words().clear;
 $('prev').textContent=words().prev;$('next').textContent=words().next;
 for(const [i,th] of [...document.querySelectorAll('th[data-col]')].entries()){th.textContent=words().headers[i]}
 if(active){run(current)}else{$('status').textContent=words().intro;empty(words().noSearch)}
}
$('langEn').addEventListener('click',()=>setLanguage('en'));
$('langTe').addEventListener('click',()=>setLanguage('te'));
$('form').addEventListener('submit',e=>{
 e.preventDefault();const name=$('name').value.trim(),surname=$('surname').value.trim(),hno=$('hno').value.trim();
 if(!name&&!surname&&!hno){error(words().error);$('name').focus();return}
 active={name,surname,hno};run(1)
});
$('prev').onclick=()=>active&&run(current-1);
$('next').onclick=()=>active&&run(current+1);
$('clear').onclick=()=>{seq++;active=null;current=1;$('form').reset();error('');$('search').disabled=false;$('status').textContent=words().intro;empty(words().noSearch);$('name').focus()};
</script></body></html>
